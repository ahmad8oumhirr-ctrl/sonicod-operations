name: Build APK SONICOD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../SONICOD-Operations.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SONICOD-Operations-APK
          path: SONICOD-Operations.apk

      - name: Publier l'APK (branche apk)
        if: success()
        run: |
          mkdir out && cp SONICOD-Operations.apk build.log out/
          cd out && git init -q && git checkout -q -b apk
          git add . && git -c user.name=ci -c user.email=ci@sonicod.ma commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk

      - name: Publier le journal d'erreur (branche build-log)
        if: failure()
        run: |
          mkdir logout && cp build.log logout/ 2>/dev/null || echo "pas de log" > logout/build.log
          cd logout && git init -q && git checkout -q -b build-log
          git add . && git -c user.name=ci -c user.email=ci@sonicod.ma commit -qm "log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-log
