name: Test complet SONICOD

on:
  push:
    branches: [ run-tests ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Test serveur (script Google)
        working-directory: tests
        run: |
          mkdir -p ../results
          ./server_test.sh 2>&1 | tee ../results/server_test.txt

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleStaffDebug assembleBotDebug 2>&1 | tail -20 | tee ../results/build.txt

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: npm install
        working-directory: tests
        run: npm install --silent

      - name: Test application (émulateur)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash tests/run_emulator.sh

      - name: Publier les résultats (branche test-results)
        if: always()
        run: |
          mkdir -p results && cd results
          git init -q && git checkout -q -b test-results
          git add . && git -c user.name=ci -c user.email=ci@sonicod.ma commit -qm "Résultats ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" test-results
